name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download face recognition library and models
        run: bash scripts/fetch-face-models.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Hudoor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Hudoor-apk
          path: Hudoor.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: حضور - الإصدار 1.0.${{ github.run_number }}
          body: "حمّل الملف Hudoor.apk بالأسفل وثبّته على جهاز أندرويد."
          files: Hudoor.apk
          make_latest: true
