plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hudoor.attendance'
    compileSdk 34

    defaultConfig {
        applicationId "com.hudoor.attendance"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress += ['bin', 'json']
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
